name: Browser diagnostics

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Browser tests to diagnose
        type: choice
        required: true
        default: history-overview
        options:
          - history-overview
          - scrollback
          - terminal-workspace
          - full

permissions:
  contents: read

# A manual diagnostic must never cancel the normal push/PR CI gate.
concurrency:
  group: browser-diagnostics-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync server dependencies
        working-directory: server
        run: uv sync --frozen

      - name: Run selected browser diagnostics
        working-directory: client
        timeout-minutes: 20
        shell: bash
        env:
          CI: "1"
          DIAGNOSTIC_SUITE: ${{ inputs.suite }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: diagnostics-artifacts/results.json
        run: |
          set -euo pipefail
          case "$DIAGNOSTIC_SUITE" in
            history-overview) specs=(tests/e2e/history-overview.spec.ts) ;;
            scrollback) specs=(tests/e2e/scrollback.spec.ts) ;;
            terminal-workspace) specs=(tests/e2e/terminal-workspace.spec.ts) ;;
            full) specs=() ;;
            *) echo "Unsupported diagnostic suite" >&2; exit 2 ;;
          esac
          mkdir -p diagnostics-artifacts
          npx playwright test "${specs[@]}" --workers=1 --retries=0 \
            --global-timeout=1080000 --trace=on \
            --reporter=list,json,./tests/reporters/ciFailureReporter.ts \
            2>&1 | tee diagnostics-artifacts/run.log

      # The test's own deadline leaves time to flush reports and upload them.
      # A hard runner/job cancellation can still prevent this step from running.
      - name: Upload browser diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-diagnostics-${{ inputs.suite }}-${{ github.run_attempt }}
          path: |
            client/test-results/
            client/diagnostics-artifacts/
          if-no-files-found: warn
          retention-days: 7
