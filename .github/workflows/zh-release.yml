name: 汉化版：同步上游并发布

# 每天检查原项目 nazmiefearmutcu/flowmap 有没有新提交；有就拉下最新源码、
# 套上 zh-patch（汉化 + 自动更新）、编译 Windows 安装包、签名并发布 Release。
# 已安装的 FlowMap 中文版会通过 Release 里的 latest.json 发现并安装新版本。
on:
  schedule:
    - cron: '17 1 * * *'   # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游没有更新也重新构建'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['zh-patch/**', '.github/workflows/zh-release.yml']

permissions:
  contents: write

concurrency:
  group: zh-release
  cancel-in-progress: false

env:
  UPSTREAM: nazmiefearmutcu/flowmap
  UPSTREAM_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
      key: ${{ steps.decide.outputs.key }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 比较上游最新提交与上次发布
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "https://github.com/$UPSTREAM.git" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          PATCH=$(find zh-patch .github/workflows/zh-release.yml -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-10)
          KEY="${SHA:0:12}-$PATCH"
          LAST=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | sed -n 's/.*build-key: \([0-9a-f-]*\).*/\1/p' | head -1 || true)
          echo "upstream=$SHA patch=$PATCH last=$LAST"
          BUILD=true
          if [ "$LAST" = "$KEY" ] && [ "$FORCE" != "true" ]; then BUILD=false; fi
          UPV=$(curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM/$SHA/app/src-tauri/tauri.conf.json" | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])")
          UPV=$(echo "$UPV" | cut -d- -f1)
          VERSION="$UPV-$GITHUB_RUN_NUMBER"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### 上游 $SHA → 构建：$BUILD（版本 $VERSION）" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}
          path: flowmap
          fetch-depth: 50

      - name: 检查签名密钥
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$K" ]; then echo "缺少仓库 Secret：TAURI_SIGNING_PRIVATE_KEY（更新包签名私钥）" | tee -a build.log; exit 1; fi

      - name: 套用汉化与自动更新补丁
        run: python fork/zh-patch/apply.py flowmap "$VERSION" "$ENDPOINT" "$(cat fork/zh-patch/updater.pub)" 2>&1 | tee -a build.log

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: flowmap/app/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5

      - name: 编译前端
        working-directory: flowmap/client
        run: |
          { npm ci && npx vite build; } 2>&1 | tee -a ../../build.log

      - name: 打包内置 Python 运行时
        working-directory: flowmap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash app/scripts/bundle-python.sh x86_64-pc-windows-msvc 2>&1 | tee -a ../build.log

      - name: 生成图标并编译安装包
        working-directory: flowmap/app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npx --yes @tauri-apps/cli@2 icon ../icons/icon-1024.png 2>&1 | tail -5 | tee -a ../../../build.log
          npx --yes @tauri-apps/cli@2 build --bundles nsis 2>&1 | tee -a ../../../build.log

      - name: 冒烟测试内置服务器
        working-directory: flowmap
        run: |
          set -euo pipefail
          PY="app/src-tauri/resources/pyruntime/python.exe"
          "$PY" app/scripts/import-gate.py
          PORT=8799; DATA_DIR="$(mktemp -d)"
          FLOWMAP_HOST=127.0.0.1 FLOWMAP_PORT="$PORT" FLOWMAP_RECORDING_ENABLED=0 FLOWMAP_DATA_DIR="$DATA_DIR" "$PY" -m flowmap_server &
          SRV=$!; ok=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" 2>/dev/null | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 1
          done
          kill "$SRV" 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "服务器健康检查失败" | tee -a ../build.log; exit 1; }
          echo "服务器健康检查通过" | tee -a ../build.log

      - name: 生成 latest.json 并发布
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          KEY: ${{ needs.check.outputs.key }}
        run: |
          set -euo pipefail
          B=flowmap/app/src-tauri/target/release/bundle/nsis
          EXE=$(ls "$B"/*-setup.exe | head -1)
          SIG="$EXE.sig"
          NAME="FlowMap-zh_${VERSION}_x64-setup.exe"
          mkdir -p out
          cp "$EXE" "out/$NAME"
          cp "$SIG" "out/$NAME.sig"
          LOG=$(git -C flowmap log -8 --format='- %s' | sed 's/"/'"'"'/g')
          DATE=$(git -C flowmap log -1 --format=%cs)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/zh-v$VERSION/$NAME"
          python - "$VERSION" "$URL" "out/$NAME.sig" "$SHA" "$DATE" <<'PY'
          import json, sys, datetime, subprocess
          ver, url, sigf, sha, date = sys.argv[1:]
          log = subprocess.run(['git', '-C', 'flowmap', 'log', '-6', '--format=- %s'], capture_output=True, text=True).stdout.strip()
          notes = f"已同步原项目到 {sha[:7]}（{date}）。最近更新：\n{log}"
          json.dump({
              'version': ver,
              'notes': notes,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {'windows-x86_64': {'signature': open(sigf).read().strip(), 'url': url}},
          }, open('out/latest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          {
            echo "FlowMap 中文版 $VERSION"
            echo
            echo "下载 \`$NAME\` 安装即可；已安装的会在启动时自动提示更新。"
            echo
            echo "原项目提交：https://github.com/$UPSTREAM/commit/$SHA （$DATE）"
            echo
            echo "最近的原项目更新："
            echo "$LOG"
            echo
            echo "<!-- build-key: $KEY -->"
          } > out/notes.md
          gh release create "zh-v$VERSION" "out/$NAME" "out/$NAME.sig" out/latest.json \
            --repo "$GITHUB_REPOSITORY" --title "FlowMap 中文版 $VERSION" --notes-file out/notes.md --latest

      - name: 把构建日志保存到 zh-build-log 分支
        if: always()
        run: |
          LOGF="$GITHUB_WORKSPACE/build.log"
          STATUS="${{ job.status }}"
          cd fork
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan zh-build-log
          git rm -rfq . >/dev/null 2>&1 || true
          if [ -f "$LOGF" ]; then tail -c 3000000 "$LOGF" > build.log; else echo "(无日志)" > build.log; fi
          echo "$STATUS $VERSION run=$GITHUB_RUN_ID $(date -u +%FT%TZ)" > status.txt
          git add build.log status.txt
          git commit -qm "build log $VERSION ($STATUS)"
          git push -qf origin zh-build-log
