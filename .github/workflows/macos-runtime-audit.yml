name: macOS Intel runtime audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-runtime-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust for the cryptography source build
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-apple-darwin

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Bundle and audit the Intel macOS Python runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p runtime-audit
          {
            uname -a
            rustc --version
            uv --version
            brew --prefix openssl@3
            bash app/scripts/bundle-python.sh x86_64-apple-darwin
          } 2>&1 | tee runtime-audit/bundle.log

      - name: Smoke test the bundled server
        run: |
          set -euo pipefail
          PY="$PWD/app/src-tauri/resources/pyruntime/bin/python3.13"
          DATA_DIR="$(mktemp -d)"
          FLOWMAP_HOST=127.0.0.1 FLOWMAP_PORT=8799 FLOWMAP_RECORDING_ENABLED=0 FLOWMAP_DATA_DIR="$DATA_DIR" \
            "$PY" -m flowmap_server > runtime-audit/server.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/api/health > runtime-audit/health.json 2>/dev/null \
                && grep -q '"status":"ok"' runtime-audit/health.json; then
              echo "Bundled server health OK"
              exit 0
            fi
            sleep 1
          done
          echo "Bundled server health check FAILED" >&2
          cat runtime-audit/server.log
          exit 1

      - name: Preserve runtime dependency and smoke-test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-intel-runtime-audit
          path: |
            runtime-audit/
            app/src-tauri/resources/.cache/macos-runtime-minimum.json
            app/src-tauri/resources/.cache/tauri-macos-minimum.json
          if-no-files-found: error
