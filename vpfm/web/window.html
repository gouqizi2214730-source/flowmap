<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VPFM</title>
<link rel="icon" type="image/svg+xml" href="common/vpfm-mark.svg">
<link rel="stylesheet" href="common/base.css">
<style>
  /* 独立窗口：整个窗口就是一个模块 */
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); }
  .mod { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .missing { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-dim); }
</style>
<script>try{var p=JSON.parse(localStorage.getItem('vpfm.prefs')||'{}');if(p.updown==='red-up')document.documentElement.dataset.updown='red-up'}catch(e){}</script>
</head>
<body>
<div class="vp-toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="modules.js"></script>
<script src="window.js"></script>
</body>
</html>
