<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>衍生品数据</title>
<link rel="stylesheet" href="../common/base.css">
<link rel="stylesheet" href="../common/module.css">
<link rel="stylesheet" href="derivs.css">
</head>
<body>
<header class="topbar">
  <h1>衍生品数据</h1>
  <div class="coin-pick">
    <input class="field" id="coin" list="coinList" spellcheck="false" autocomplete="off" aria-label="币种" title="输入币种后回车，例如 BTC、ETH、SOL">
    <datalist id="coinList"></datalist>
    <div class="chips" id="quick"></div>
  </div>
  <div class="seg" id="tf" role="group" aria-label="周期"></div>
  <div class="spacer"></div>
  <span class="status" id="status">加载中…</span>
</header>

<div class="scroll" id="scroll">
  <section class="kpis kpi-strip" id="kpis" aria-label="关键指标"></section>

  <div class="layout">
    <section class="charts">
      <div class="pane" id="p-price" style="flex:330 0 330px">
        <div class="pane-head"><h3>价格</h3><span class="note" id="priceSrc"></span><div class="legend" id="lg-price"></div></div>
        <div class="pane-body"></div>
      </div>
      <div class="pane" id="p-cvd" style="flex:170 0 170px">
        <div class="pane-head"><h3>累计主动买卖差（CVD）</h3><div class="legend" id="lg-cvd"></div><span class="tip-i" title="每根 K 线的主动买入量减主动卖出量，按收盘价折成美元后从最左边开始累加。合约和现货分开算：两条线背离时，说明涨跌主要由哪个市场推动。">?</span></div>
        <div class="pane-body"></div>
      </div>
      <div class="pane" id="p-oi" style="flex:190 0 190px">
        <div class="pane-head"><h3>持仓量（美元，堆叠）</h3><div class="legend" id="lg-oi"></div><span class="tip-i" title="币安和 Bybit 是该交易对的持仓（单边计），OKX 是该币全部合约的持仓。持仓上升代表新开仓，下降代表平仓或爆仓。">?</span></div>
        <div class="pane-body"></div>
      </div>
      <div class="pane" id="p-funding" style="flex:170 0 170px">
        <div class="pane-head"><h3>资金费率（折算到 8 小时）</h3><div class="legend" id="lg-funding"></div><span class="tip-i" title="每次结算的资金费率。有的币每 1 或 4 小时结算一次，这里统一折算成 8 小时的费率方便比较。正数表示多头付钱给空头。">?</span></div>
        <div class="pane-body"></div>
      </div>
      <div class="pane" id="p-ls" style="flex:170 0 170px">
        <div class="pane-head"><h3>多空比</h3><div class="legend" id="lg-ls"></div><span class="tip-i" title="人数比：持有多单的账户数 ÷ 持有空单的账户数。大户持仓比：保证金最多的前 20% 账户的多单持仓 ÷ 空单持仓。">?</span></div>
        <div class="pane-body"></div>
      </div>
    </section>

    <aside class="liqs" aria-label="实时爆仓">
      <div class="liq-head">
        <h3>实时爆仓</h3>
        <div class="seg" id="liqScope"><button type="button" data-v="coin">本币</button><button type="button" data-v="all">全部</button></div>
        <select class="field" id="liqMin" aria-label="最小金额">
          <option value="0">全部金额</option><option value="1000">≥ $1千</option><option value="10000">≥ $1万</option>
          <option value="50000">≥ $5万</option><option value="100000">≥ $10万</option><option value="500000">≥ $50万</option>
        </select>
      </div>
      <div class="liq-feeds" id="liqFeeds"></div>
      <div class="liq-sum" id="liqSum"></div>
      <canvas class="liq-bars" id="liqBars" height="84" aria-label="最近 60 分钟每分钟爆仓金额"></canvas>
      <ol class="liq-list" id="liqList"></ol>
    </aside>
  </div>

  <section class="board">
    <div class="board-head">
      <h2>跨交易所资金费率</h2>
      <span class="dim">统一折算到 8 小时；颜色越深费率越极端；最大价差按年化计算</span>
      <div class="spacer"></div>
      <input class="field" id="boardFilter" placeholder="筛选币种" spellcheck="false" autocomplete="off" style="width:110px">
      <span class="status" id="boardStatus"></span>
    </div>
    <div class="board-wrap">
      <table class="grid" id="board">
        <thead><tr>
          <th data-sort="base">币种</th><th data-sort="price">价格</th><th data-sort="chg">24h</th>
          <th data-sort="vol">24h 成交额</th><th data-sort="oi" title="已知交易所的持仓合计">持仓合计</th>
          <th data-sort="f_binance">币安</th><th data-sort="f_bybit">Bybit</th><th data-sort="f_okx">OKX</th>
          <th data-sort="f_bitget">Bitget</th><th data-sort="f_hyperliquid">Hyperliquid</th><th data-sort="spread" title="各交易所折算费率的最大差值 × 3 × 365">最大价差/年</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<script src="../vendor/lightweight-charts.standalone.production.js"></script>
<script src="../common/vpfm.js"></script>
<script src="derivs.js"></script>
</body>
</html>
