<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>VPFM</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b111b; color: #d6deea; font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif; }
  body { display: grid; place-items: center; }
  .box { width: min(440px, 86vw); text-align: center; }
  .mark { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 auto 26px; }
  .mark i { display: block; height: 9px; border-radius: 5px; animation: heat 2.4s ease-in-out infinite; }
  .mark i:nth-child(1) { width: 120px; background: #2e6fd8; animation-delay: 0s; }
  .mark i:nth-child(2) { width: 88px; background: #45b7ff; animation-delay: .15s; }
  .mark i:nth-child(3) { width: 58px; background: #7fe0c8; animation-delay: .3s; }
  .mark i:nth-child(4) { width: 32px; background: #f2b33d; animation-delay: .45s; }
  .mark i:nth-child(5) { width: 13px; background: #ff6a3d; animation-delay: .6s; }
  @keyframes heat { 0%, 100% { opacity: .35; transform: scaleX(.92); } 45% { opacity: 1; transform: scaleX(1); } }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .08em; font-weight: 700; }
  #msg { color: #8796ab; min-height: 3.2em; }
  #err { display: none; margin-top: 18px; padding: 12px 14px; text-align: left; border: 1px solid #f0506e; border-radius: 6px; background: #22121a; color: #ffd6de; font-size: 13px; }
  #err code { color: #fff; word-break: break-all; }
  button { margin-top: 12px; height: 30px; padding: 0 16px; border-radius: 4px; border: 1px solid #f2b33d; background: #f2b33d; color: #1a1205; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .mark i { animation: none; } }
</style>
</head>
<body>
<div class="box">
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <h1>VPFM</h1>
  <div id="msg">正在启动本地行情服务…</div>
  <div id="err" role="alert"></div>
</div>
<script>
(function () {
  var srv = (window.__FLOWMAP_SERVER__ || '').replace(/\/+$/, '');
  var t0 = Date.now(), done = false;
  var msg = document.getElementById('msg'), err = document.getElementById('err');
  function fail(text) {
    err.style.display = 'block';
    err.innerHTML = text + '<br>日志在应用数据目录的 <code>flowmap-server.log</code>（%APPDATA%\\com.gouqizi.vpfm）。<br><button type="button" onclick="location.reload()">重试</button>';
  }
  if (!srv) { fail('没有拿到本地服务的地址，请重新打开 VPFM。'); return; }
  function tick() {
    if (done) return;
    var s = (Date.now() - t0) / 1000;
    if (s > 12) msg.textContent = '第一次启动要准备运行环境，可能需要多等一会儿…';
    if (s > 120) { fail('本地服务两分钟内没有启动成功。可能被杀毒软件拦截，或者端口被占用。'); return; }
    fetch(srv + '/api/health', { mode: 'no-cors', cache: 'no-store' }).then(function () {
      done = true;
      msg.textContent = '正在打开…';
      location.replace(srv + '/wb/' + (location.hash || ''));
    }, function () { setTimeout(tick, 400); });
  }
  tick();
})();
</script>
</body>
</html>
